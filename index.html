<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif;color:#fff}
canvas{display:block}
#hud{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));font-size:13px;line-height:1.5;text-shadow:0 1px 3px #000;pointer-events:none}
#cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#fffa;border-radius:50%;pointer-events:none}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0007;text-align:center;cursor:pointer;font-size:18px;line-height:1.7}
#dev{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:250px;background:#111e;border:1px solid #fff3;border-radius:10px;padding:12px;display:none;font-size:13px}
#dev label{display:block;margin-top:10px}#dev input[type=range]{width:100%}
.r{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
#dev button{background:#2a2f3a;color:#fff;border:1px solid #fff2;border-radius:6px;padding:5px 8px;cursor:pointer;font-size:12px}
#dev button.on{background:#3b82f6}
#load{position:fixed;inset:0;z-index:99;background:#0b1016;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px}.sp{width:44px;height:44px;margin:18px auto;border:4px solid #fff3;border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#dead{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:#7a000077;z-index:5;cursor:pointer;line-height:1.8}
#scope{position:fixed;inset:0;display:none;pointer-events:none;background:radial-gradient(circle at center,transparent 0,transparent 33vmin,#000 33.4vmin)}#scope::before,#scope::after{content:"";position:absolute;left:50%;top:50%;background:#000;transform:translate(-50%,-50%)}#scope::before{width:66vmin;height:1px}#scope::after{width:1px;height:66vmin}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.38) 100%)}
#hb{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:2px;background:#0008;padding:3px;border:2px solid #000a;z-index:4}#hb div{position:relative;width:40px;height:40px;background:#8b8b8b55;border:2px solid #3a3a3a;box-sizing:border-box}#hb div.on{border-color:#fff;background:#fff3}#hb b{position:absolute;left:2px;top:0;font-size:10px;color:#fff;text-shadow:1px 1px #000}#hb canvas{width:100%;height:100%;image-rendering:pixelated}
#lens{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}body{touch-action:none;-webkit-user-select:none;user-select:none}
#jb{position:fixed;width:110px;height:110px;border-radius:50%;background:#fff2;border:2px solid #fff5;display:none;z-index:6;pointer-events:none}#jb div{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#fffa}
.mb{position:fixed;z-index:6;width:64px;height:64px;border-radius:50%;background:#0006;border:2px solid #fff6;color:#fff;font:700 11px system-ui;display:flex;align-items:center;justify-content:center;user-select:none}.mob #dev{top:calc(60px + env(safe-area-inset-top,0px));max-height:75vh;overflow:auto}
#load{background:#000}#lw{width:min(70vw,520px)}#lt{font:500 13px system-ui;color:#999;letter-spacing:.2em;text-transform:uppercase}#lb{height:10px;border:1px solid #fff5;margin:14px 0;background:#111}#bar{display:block;height:100%;width:0;background:linear-gradient(90deg,#4caf50,#c6ff8a);transition:width .25s}#pct{font:600 22px system-ui;color:#fff;letter-spacing:.1em}
